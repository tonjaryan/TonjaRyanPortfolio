<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Reviewing with the Co-Pilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a review desk. Instruction sits on paper in ink; anything the co-pilot says sits in a dark console panel with amber labels. One stage per screen, sticky header with progress, sticky audio bar at the foot. */
/* Palette: white, black, blue, with light-blue highlights. Single light theme by choice. */
:root {
  --primary: #1A56DB; --on-primary: #FFFFFF; --primary-container: #E6EFFD;
  --paper: #FFFFFF;
  --surface: #FFFFFF;
  --ink: #0B0D10;
  --muted: #4A5260;
  --rule: #DADFE6;
  --soft: #F3F6FA;
  --amber: #1A56DB;
  --amber-ink: #1A3F99;
  --amber-tint: #E6EFFD;
  --console: #0B0D10;
  --console-2: #1C2129;
  --console-ink: #F2F4F7;
  --console-muted: #A3ACB9;
  --console-amber: #8DB8FF;
  --good: #1A56DB;
  --good-tint: #E6EFFD;
  --bad: #0B0D10;
  --bad-tint: #F1F2F4;
  --band-all: #E6EFFD; --band-all-t: #1A3F99;
  --band-7: #A9C7F7; --band-7-t: #0B2A6B;
  --band-12: #4F86EA; --band-12-t: #FFFFFF;
  --band-16: #1A3F99; --band-16-t: #FFFFFF;
  --band-18: #0B0D10; --band-18-t: #FFFFFF;
  --focus: #1A56DB;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Public Sans", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--font-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; }
#stage { max-width: none; width: min(100%, max(66.67vw, 880px)); margin: 0 auto; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--rule); }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.brand .name { font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 1.15; }
.steps { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.step { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface); font-family: var(--font-mono); font-size: 11px; color: var(--muted); display: grid; place-items: center; padding: 0; }
.step.done { background: var(--soft); color: var(--ink); }
.step.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.step.q { border-color: var(--primary); }

/* Stage */
main { padding-block: 28px 110px; }
.screen-head { display: grid; gap: 8px; margin-bottom: 22px; }
.kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.kicker .obj { font-family: var(--font-mono); letter-spacing: 0; text-transform: none; font-weight: 500; color: var(--amber-ink); background: var(--amber-tint); padding: 1px 7px; border-radius: 4px; font-size: 11.5px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 4.4vw, 44px); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -.005em; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.2; margin: 0; text-wrap: balance; }
h3 { font-size: 15px; margin: 0; font-weight: 700; }
p { margin: 0; }
.lead { font-size: 18px; color: var(--muted); max-width: 65ch; }
.task { border-top: 2px solid var(--ink); padding-top: 18px; margin: 34px 0 20px; display: grid; gap: 10px; }
.task-tag { justify-self: start; background: var(--ink); color: var(--surface); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 4px 10px; border-radius: 4px; }
.task-dir { font-size: 18px; font-weight: 500; line-height: 1.5; }
.task-dir b { font-weight: 800; }
.task-dir ol { margin: 6px 0 0; padding-left: 22px; display: grid; gap: 4px; font-weight: 500; font-size: 16.5px; }
.qlabel { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 28px; align-items: start; }
@media (max-width: 820px) { .grid2, .split { grid-template-columns: minmax(0, 1fr); } }
.stack { display: grid; gap: 14px; }
.points { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.points li { padding-left: 22px; position: relative; max-width: 60ch; }
.points li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px; min-width: 0; }
.card.plain { background: transparent; border-style: dashed; }
.label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.note { font-size: 14px; color: var(--muted); }

/* Buttons */
.btn { border: 1px solid var(--primary); background: var(--primary); color: var(--on-primary); padding: 10px 20px; border-radius: 999px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
.btn.ghost { background: transparent; color: var(--primary); border-color: var(--rule); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.chipbtn { border: 1px solid var(--rule); background: var(--surface); padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 14.5px; text-align: left; }
.chipbtn[aria-pressed="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); background: var(--primary-container); }
.chipbtn.right { border-color: var(--good); background: var(--good-tint); box-shadow: inset 0 0 0 1px var(--good); }
.chipbtn.wrong { border-color: var(--bad); background: var(--bad-tint); box-shadow: inset 0 0 0 1px var(--bad); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Rating band badge */
.band { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; white-space: nowrap; height: 26px; padding: 0 8px; border-radius: 5px; font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .02em; border: 1px solid var(--band-16); }
.b-0 { background: #EEF4FE; color: #1A3F99; border-color: #A9C7F7 !important; } .b-1 { background: #CFE0FB; color: #0B2A6B; border-color: #A9C7F7 !important; } .b-2 { background: #A9C7F7; color: #0B2A6B; } .b-3 { background: #4F86EA; color: #FFFFFF; } .b-4 { background: #1A3F99; color: #FFFFFF; } .b-5 { background: #0B0D10; color: #FFFFFF; }
.lvl { font-family: var(--font-mono); font-size: 12px; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; }

/* Co-pilot console */
.console { background: var(--console); color: var(--console-ink); border-radius: var(--r); padding: 18px; font-size: 14.5px; position: relative; min-width: 0; }
.console .chead { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid var(--console-2); padding-bottom: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.console .tag { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--console-amber); display: flex; align-items: center; gap: 8px; }
.console .tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--console-amber); }
.console .ttl { font-family: var(--font-mono); font-size: 12px; color: var(--console-muted); }
.console .zone { border: 1px solid transparent; border-radius: 8px; padding: 10px; position: relative; }
.console .zone + .zone { margin-top: 6px; }
.console .zl { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--console-muted); margin-bottom: 6px; }
.console .warn { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 4px 0; }
.console .warn b { font-weight: 600; }
.console .ts { font-family: var(--font-mono); font-size: 12.5px; color: var(--console-amber); background: var(--console-2); padding: 1px 6px; border-radius: 4px; }
.console .conf { display: inline-flex; gap: 3px; vertical-align: middle; }
.console .conf i { width: 14px; height: 6px; border-radius: 2px; background: var(--console-2); display: block; }
.console .conf i.f { background: var(--console-amber); }
.console .readout { font-family: var(--font-mono); font-size: 13px; line-height: 1.6; color: var(--console-ink); background: var(--console-2); border-radius: 8px; padding: 12px; }
.console .hot { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--console-amber); background: var(--console); color: var(--console-amber); font-family: var(--font-mono); font-size: 12px; font-weight: 600; display: grid; place-items: center; padding: 0; }
.console .zone.lit { border-color: var(--console-amber); background: var(--console-2); }
.console .hot[aria-pressed="true"] { background: var(--console-amber); color: var(--console); }
.console .hot[aria-expanded="true"] { background: var(--console-amber); color: var(--console); }
.playline { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
.mini { border: 1px solid var(--console-muted); background: transparent; color: var(--console-ink); border-radius: 6px; font-size: 12.5px; padding: 5px 10px; font-family: var(--font-mono); }

/* Annotations */
.anno { display: grid; gap: 10px; }
.anno .a { border-left: 3px solid var(--rule); padding: 4px 0 4px 12px; color: var(--muted); }
.anno .a.on { border-color: var(--amber); color: var(--ink); }
.anno .a b { color: var(--ink); }

/* Feedback */
.fb { border-radius: 8px; padding: 12px 14px; font-size: 15px; border: 1px solid; }
.fb.ok { border-color: var(--good); background: var(--good-tint); }
.fb.no { border-color: var(--bad); background: var(--bad-tint); }
.fb b { display: block; margin-bottom: 2px; }

/* Before / after */
.form { display: grid; gap: 8px; }
.field { border: 1px dashed var(--rule); border-radius: 6px; padding: 8px 10px; font-size: 14px; color: var(--muted); min-height: 38px; }
.field.filled { border-style: solid; color: var(--ink); background: var(--amber-tint); border-color: var(--amber); }
.field .k { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; display: block; color: var(--muted); }

/* Evidence check */
.ev { display: grid; gap: 12px; }
.evrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px; }
@media (max-width: 560px) { .evrow { grid-template-columns: minmax(0, 1fr); } }
.evrow .what { display: grid; gap: 4px; min-width: 0; }
.evrow .sug { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 600; }
.evrow .scene { color: var(--muted); font-size: 14.5px; }

/* Timeline */
.tl { width: 100%; height: auto; display: block; }

/* Market cards */
.mkts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 720px) { .mkts { grid-template-columns: minmax(0, 1fr); } }
.mkt { text-align: left; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; align-content: start; min-height: 150px; }
.mkt .mk { font-family: var(--font-display); font-weight: 700; font-size: 26px; }
.mkt[aria-expanded="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.mkt .rule { font-size: 14.5px; }

/* Decision tree */
.tree { display: grid; gap: 10px; }
.node { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.node.done { opacity: .7; }
.out { border-radius: var(--r); padding: 14px 16px; border: 2px solid var(--ink); background: var(--surface); }
.out .act { font-family: var(--font-display); font-weight: 700; font-size: 26px; }
table.t { border-collapse: collapse; width: 100%; font-size: 14.5px; }
table.t th, table.t td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.t th { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tscroll { overflow-x: auto; }

/* Rationale builder */
.rb { display: grid; gap: 12px; }
.rb label { font-weight: 600; font-size: 14px; display: grid; gap: 6px; }
.rb label span { font-weight: 400; color: var(--muted); font-size: 13.5px; }
.rb input, .rb textarea { width: 100%; border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; background: var(--surface); }
.rb textarea { min-height: 70px; resize: vertical; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14.5px; }
.checks li { display: flex; gap: 8px; align-items: baseline; }
.checks li::before { content: "○"; color: var(--muted); font-family: var(--font-mono); }
.checks li.ok::before { content: "●"; color: var(--good); }

/* Queue */
.queue { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) { .queue { grid-template-columns: minmax(0, 1fr); } }
.qlist { display: grid; gap: 6px; }
@media (max-width: 900px) { .qlist { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 480px) { .qlist { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.qitem { text-align: left; border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 9px 11px; display: grid; gap: 2px; min-width: 0; }
.qitem .n { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.qitem .tt { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qitem.on { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.qitem .st { font-size: 12px; font-weight: 600; }
.qitem .st.ok { color: var(--good); } .qitem .st.no { color: var(--bad); } .qitem .st.open { color: var(--muted); font-weight: 500; }
.titlecard { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.poster { width: 64px; height: 90px; border-radius: 6px; flex: none; display: grid; place-items: end start; padding: 6px; font-family: var(--font-display); font-weight: 700; font-size: 12px; line-height: 1; color: #fff; }
.mpill { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; }
.evlog { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.evlog li { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 10px; font-size: 14.5px; }
.evlog .ts { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); padding-top: 2px; }
.conf-in { display: grid; gap: 6px; }
.conf-in input { width: 100%; accent-color: var(--primary); }
.conf-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

/* Results */
.big { font-family: var(--font-display); font-weight: 700; font-size: 56px; line-height: 1; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 640px) { .kv { grid-template-columns: minmax(0, 1fr); } }
.jobaid { border: 2px solid var(--ink); border-radius: var(--r); background: var(--surface); padding: 22px; display: grid; gap: 18px; }
.jobaid h2 { font-size: 26px; }
.ja-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 720px) { .ja-grid { grid-template-columns: minmax(0, 1fr); } }
.ja-grid ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14.5px; }

/* Narration box */
.narr { background: var(--primary-container); border: 1px solid #C6D9FA; border-radius: var(--r); padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: start; margin-bottom: 24px; }
@media (max-width: 560px) { .narr { grid-template-columns: minmax(0, 1fr); } }
.narr p { font-size: 16.5px; line-height: 1.6; color: var(--ink); }
.listen { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--primary); background: var(--surface); color: var(--primary); border-radius: 999px; padding: 6px 13px 6px 10px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.listen svg { width: 13px; height: 13px; fill: currentColor; }
.listen[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.fb .listen { margin-top: 10px; }
/* Screen 2 tooltips */
.s2wrap { max-width: 640px; margin: 0 auto; }
.tipzone:hover { border-color: var(--console-amber); background: var(--console-2); }
.tipzone { padding-right: 44px; }
.tipzone .hot { cursor: pointer; z-index: 2; }
.tipzone .hot:focus-visible { outline: 2px solid var(--console-amber); outline-offset: 2px; }
.tipzone.open { border-color: var(--console-amber); background: var(--console-2); }
.tipzone.open .tip { opacity: 1; visibility: visible; }
.tip { position: absolute; left: calc(100% + 18px); top: 4px; width: 260px; background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; font-size: 14.5px; line-height: 1.45; box-shadow: 0 6px 20px rgba(11, 13, 16, .14); z-index: 4; opacity: 0; visibility: hidden; transition: opacity .12s; display: grid; gap: 3px; font-family: var(--font-body); }
.tip b { color: var(--primary); }
.tip::before { content: ""; position: absolute; left: -7px; top: 14px; width: 12px; height: 12px; background: var(--surface); border-left: 1px solid var(--rule); border-bottom: 1px solid var(--rule); transform: rotate(45deg); }
@media (hover: hover) { .tipzone:hover .tip { opacity: 1; visibility: visible; } }
@media (max-width: 1240px) { .tip { position: static; width: auto; margin-top: 10px; box-shadow: none; display: none; } .tipzone.open .tip { display: grid; } .tip::before { display: none; } }
@media (max-width: 1240px) and (hover: hover) { .tipzone:hover .tip { display: grid; } }
.aside-sec { margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--rule); display: grid; gap: 16px; }
.sw { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.sw .card { align-content: start; }
@media (max-width: 640px) { .sw { grid-template-columns: minmax(0, 1fr); } }
/* Level buttons: light to dark blue, black for explicit */
.lvbtn { border: 2px solid transparent; border-radius: 8px; padding: 8px 16px; font-weight: 700; font-size: 14.5px; min-width: 100px; transition: transform .08s; }
.lv-mild { background: #CFE0FB; color: #0B2A6B; border-color: #A9C7F7; }
.lv-moderate { background: #4F86EA; color: #FFFFFF; }
.lv-intense { background: #1A3F99; color: #FFFFFF; }
.lv-graphic { background: #0B0D10; color: #FFFFFF; }
.lvbtn:disabled { cursor: default; }
.lvbtn.right { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--ink); }
.lvbtn.right::before { content: "\2713  "; }
.lvbtn.wrong { text-decoration: line-through; opacity: .55; }
.lvbtn.dim { opacity: .3; }
.lvhead { display: flex; align-items: center; gap: 10px; margin: 18px 0 2px; }
.lvhead h2 { font-size: 22px; }
.lvhead .sw8 { width: 18px; height: 18px; border-radius: 4px; }
/* Shared interaction pieces */
.lvchip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }
.sys { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; } .sys .note { width: 36px; font-weight: 700; }

<script>
/* =====================================================================
   Reviewing with the Co-Pilot · revised build
   Content layers, kept distinct everywhere in this file:
   1. PUBLISHED: U.S. TV Parental Guidelines and MPA Classification and Rating Rules (see SRC).
   2. SYNTHETIC: every title, scene, timestamp, and co-pilot suggestion.
   3. ILLUSTRATIVE: the co-pilot interface, the accept / modify / override / escalate workflow,
      QA sampling, the violence intensity ladder, and the fictional "Training Market X" card.
   ===================================================================== */
const DURATION = "about 2 to 3 hours";
const DURATION_NOTE = "Estimate only. It has not been timed with learners yet.";

const T = {
  s0: "Welcome to Reviewing with the Co-Pilot. This is a stand-alone demonstration, designed as Module 3 of a proposed onboarding program for content analysts. This independent training simulation uses published U.S. television and film rating guidelines alongside fictional titles, scenes, and simulated AI suggestions. The co-pilot interface and analyst review procedures are illustrative and do not represent Amazon's proprietary tools or policies. On the screens ahead you will learn four checks for an AI-suggested rating: Evidence, Context, Count, and System. You will practice choosing an action and writing a rationale, then work a queue of six cases. Plan on " + DURATION + ". That figure is an estimate and has not yet been timed with learners.",
  s1: "Until now, your work started with a blank form. You watched the title, noted each moment that affected the rating, and chose a rating. With the co-pilot, the form arrives filled in: a suggested rating, content descriptors with levels, evidence timestamps, and a short rationale are waiting before you press play. You are still responsible for the final rating. What changes is the first question you ask. Before, it was: what is in this title? Now it is: is this suggestion right, and how do I know? That second question is a skill, and this module gives you practice with it. Compare the two forms on screen, then select Next.",
  s2: "Here is the co-pilot panel for a sample series episode. It has five numbered parts. Select a number, or hover over a part, to open its explanation. Press Escape or select the number again to close it. Part one is the suggested rating. For a series, that is a TV Parental Guidelines rating such as TV-PG or TV-14. For a film, the co-pilot estimates against the MPA categories, such as PG-13 or R. Part two lists each content descriptor, such as Violence or Coarse Language, with a level: mild, moderate, intense, or graphic. Part three holds the evidence timestamps the co-pilot used. Part four is a plain-language rationale. Part five is the confidence signal, which shows how sure the model is of its own output. It does not tell you whether the rating is right. Below the panel you will see what the co-pilot tends to do well and where it slips: tone and genre, counting, and deciding which rating system applies.",
  s3: "That panel sounds certain, and that is part of the challenge. When a suggestion is fluent, specific, and labeled high confidence, people tend to check it less. This is called automation bias, and experience does not make anyone immune to it. The confidence signal reports how sure the model is. Whether the rating matches the guidelines is a separate question, and you are the one who answers it. The opposite habit costs something too. Re-reviewing every title from scratch throws away the time the tool was built to save. The goal is calibrated trust: open the evidence behind each suggestion, every time, and save a full re-review for titles that need it. Read the table on screen, then answer the four questions below it.",
  s4: "The first check is Evidence. For every descriptor the co-pilot suggests, open its timestamp and confirm the moment supports both the descriptor and its level. Most of the time it will. Sometimes the co-pilot flags something that only resembles a match: a cleaver used to cook, a playful jump scare, a bleeped word no one can hear. That is over-flagging. On this screen, twelve scenes are grouped by level, three at each. Mark each one Supported or Not supported. Four of them are not supported. When a timestamp fails to support its descriptor, remove the descriptor or lower its level, and note why. A descriptor with no matching moment stays unsupported until you find one.",
  s5: "The second check is Context. The same action can land very differently depending on how it is shown. The TV Parental Guidelines name the levels: mild fantasy or comedic violence, then moderate, intense, and graphic violence. They do not define each level with fixed rules about blood or camera time. So this module uses an illustrative training classification, shown in the guide box, to practice the judgment. Your team's own policy would supply the real one. The co-pilot rated all six scenes on screen as moderate violence, because the action in each is similar. Read each scene, then choose the level you would give it. Pay attention to tone, genre, injury detail, and how long the camera stays. Those are where the co-pilot is weakest and where your judgment counts most.",
  s6: "The third check is Count. The co-pilot tends to judge moments one at a time. Some rules depend on how often something happens, how long it lasts, or the context it appears in. The MPA rules are the clearest example, so all six examples on this screen are films. One harsher sexually derived word used as an expletive initially requires at least PG-13. More than one, or even one used in a sexual context, ordinarily requires R, though the Rating Board can still rate such a film PG-13 by a two-thirds special vote. Any drug use initially requires at least PG-13. Violence that is both realistic and extreme or persistent generally goes beyond PG-13. Only the MPA Rating Board issues MPA ratings. Here you are checking whether a co-pilot estimate is consistent with the published rules. For each film, read the plot, look at the timeline, and choose the rating the rules point to.",
  s7: "The fourth check is System. Before you judge any level, confirm which rating system applies to this title, and confirm it from the title's approved rating metadata. Series and episodes, including series made for streaming, use the TV Parental Guidelines. A theatrical film that carries an MPA rating, delivered in its unedited version, displays that MPA rating. Not every film on a streaming service has an MPA rating, though. Some were never submitted, and a version edited after rating needs to be rated again. If the metadata is missing, conflicts with the title, or leaves the system unclear, stop and escalate. Round one asks you to sort titles by system. Round two asks you to match each rule to the system it comes from.",
  s8: "After the four checks, you choose one of four actions. Accept when the suggestion passes all four checks. Modify when the co-pilot went too high or mislabeled something, such as a descriptor the evidence does not support or a level that context lowers. Add a short note. Override when the co-pilot went too low. Under-rating carries the greater risk to viewers, so in this simulated workflow every override needs a full rationale, and QA samples overrides. Escalate when the guidelines do not settle the question, when you cannot confirm which rating system applies, or when an additional policy layer, such as a market-specific review, calls for a Policy decision. Escalating is a correct decision. It means you found the edge of what the rating rules can settle. Work the four cases on screen through the decision tree: the checks come first, then the action.",
  s9: "A rationale has three parts: a claim, the evidence, and the policy that connects them. The claim states your action and the final rating. The evidence names the moments, with timestamps. The policy names the guideline or rule that applies. Study the three worked examples first. In The Long Night, the claim is: override to R, language. The evidence is the two expletives, at thirty-one minutes ten and one hour twenty-four. The policy line says that under the MPA rules, more than one such expletive ordinarily requires R, with an exception only by a special Rating Board vote. Then write your own rationale for the practice episode. The checker looks for the right action and rating, timestamps that point to relevant scenes, and a policy line that names the right principle. It matches keywords and timestamps, so it cannot judge whether your reasoning is sound. Compare your answer with the model and complete the self-check.",
  s10: "Now the queue. Six titles are waiting, each with a co-pilot suggestion. For each one, run the four checks and choose an action. If you modify or override, choose the final rating. Then select the log entries your decision rests on, choose the policy principle or escalation reason that applies, and set your confidence from one to five. Nothing is preset, so every choice is yours. For overrides and escalations, write a short rationale as well. Submit the decision to see detailed feedback. You can move between cases at any time, and your answers are saved as you go.",
  s11: "These are your results. Decision accuracy shows how many actions and final ratings matched the answer key. Reasoning shows whether you picked the evidence and the policy principle that support each decision. Written rationales are for your own comparison with the model answers. This module does not grade them. The confidence chart sets how sure you were against how each case came out. With only six cases, treat it as a first signal of possible overconfidence or underconfidence. Patterns you missed link back to the lesson that covers them, and targeted practice is available below. You can submit your results once all six cases are complete. This demo does not send them anywhere. Before you go, open the printable job aid and keep it beside your queue."
};

function focusKey(el) {
  if (!el || el === document.body || !stage.contains(el)) return null;
  if (el.id) return "#" + CSS.escape(el.id);
  for (const a of el.attributes) if (a.name.startsWith("data-") && a.name !== "data-listen") return `[${a.name}="${CSS.escape(a.value)}"]`;
  return null;
}

  const prev = opt.keepFocus === false ? null : focusKey(document.activeElement);
  if (state.cs) {
    stage.innerHTML = R.cs();

    $("#abar").hidden = true;
    document.querySelectorAll("[data-live]").forEach(b => b.addEventListener("click", () => { state.cs = false; go(state.i); }));

  stage.innerHTML = R[s.id](s);

  $("#where").textContent = state.i > LAST ? "Optional page" : `Screen ${state.i} of ${LAST}`;

  let target = opt.focus ? stage.querySelector(opt.focus) : null;
  if (!target && prev) { const t = stage.querySelector(prev); if (t && !t.disabled) target = t; }
  if (target) { if (target.tabIndex < 0 && !target.hasAttribute("tabindex")) target.setAttribute("tabindex", "-1"); target.focus({ preventScroll: !opt.focus }); }
}
